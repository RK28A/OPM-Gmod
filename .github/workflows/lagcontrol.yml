name: LagControl

on:
  push:
    branches: ["**"]
    paths: ["LagControl/**", ".github/workflows/lagcontrol.yml"]
  pull_request:
    paths: ["LagControl/**", ".github/workflows/lagcontrol.yml"]
  workflow_dispatch:

jobs:
  core-tests:
    name: Core tests (gcc + sanitizers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run
        working-directory: LagControl/tests
        run: |
          g++ -std=c++17 -Wall -Wextra -Wpedantic -Werror -fsanitize=address,undefined -I../src core_tests.cpp -o core_tests
          ./core_tests

  build:
    name: LagControl.exe (MSVC x64, build.bat)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: build.bat
        shell: cmd
        working-directory: LagControl
        run: build.bat
      - uses: actions/upload-artifact@v4
        with:
          name: LagControl-windows-x64
          path: |
            LagControl/dist/LagControl.exe
            LagControl/dist/WinDivert.dll
            LagControl/dist/WinDivert64.sys
          if-no-files-found: error
